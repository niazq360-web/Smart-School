<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart School Management System</title>
    <!-- Google Fonts for clean modern typography & Noto Naskh Arabic for Urdu / Sindhi -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Noto+Naskh+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
              arabic: ['"Noto Naskh Arabic"', 'serif'],
            },
            colors: {
              school: {
                950: '#09153a',
                900: '#1e3a8a',
                800: '#1e40af',
                700: '#1d4ed8',
              }
            }
          }
        }
      }
    </script>
    <style>
      @media print {
        header, aside, button, .no-print {
          display: none !important;
        }
        body, main {
          background: white !important;
          color: black !important;
          padding: 0 !important;
          margin: 0 !important;
        }
      }
      [dir="rtl"] {
        text-align: right;
      }
    </style>
  </head>
  <body class="bg-slate-100 text-slate-800 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
